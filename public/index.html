<style>

const saveSlots=async()=>{const slots=zsl.value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(\d{1,2}:\d{2})\s*[-–—]\s*(\d{1,2}:\d{2})$/);if(!m)throw new Error("Noto'g'ri qator: "+l);const p=t=>t.padStart(5,'0');return{start:p(m[1]),end:p(m[2])}});await api('PUT','/bell_slots',{slots});msg('Saqlandi');V.set()};

 if(prompt("Joriy ma'lumotlar zaxiradagi holat bilan ALMASHTIRILADI. Davom etish uchun TIKLASH deb yozing:")!=='TIKLASH'){msg('Bekor qilindi');return}

/* Premium animatsiya qatlami */
(()=>{const io=new IntersectionObserver(en=>en.forEach(x=>{if(x.isIntersecting){x.target.classList.add('vis');io.unobserve(x.target)}}),{threshold:.12});
const cnt=el=>{const n=+el.textContent;if(!Number.isFinite(n)||el.dataset.c||el.textContent.trim()==='')return;el.dataset.c=1;const t0=performance.now(),d=1100;(function f(t){const k=Math.min((t-t0)/d,1);el.textContent=Math.round(n*(1-Math.pow(1-k,4)));if(k<1)requestAnimationFrame(f)})(t0)};
const run=()=>{document.querySelectorAll('.rv:not(.vis)').forEach(x=>io.observe(x));document.querySelectorAll('.st>div').forEach(cnt)};
new MutationObserver(run).observe(document.body,{childList:true,subtree:true});run();
document.addEventListener('pointermove',ev=>{const c=ev.target.closest&&ev.target.closest('.card,.st,.tc');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',ev.clientX-r.left+'px');c.style.setProperty('--my',ev.clientY-r.top+'px')}},{passive:true});
document.addEventListener('pointerdown',ev=>{const b=ev.target.closest&&ev.target.closest('.b');if(!b)return;const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),o=document.createElement('span');o.className='rp';o.style.cssText=`width:${s}px;height:${s}px;left:${ev.clientX-r.left-s/2}px;top:${ev.clientY-r.top-s/2}px`;b.appendChild(o);setTimeout(()=>o.remove(),600)});
})();
