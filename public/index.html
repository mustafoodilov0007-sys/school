<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maktab platformasi</title>
<style>
:root{--bg:#eef2fb;--c:#fff;--t:#17203a;--m:#6a7694;--p:#0265fe;--p2:#0a3fc4;--b:#e3e8f4;--r:#e5484d;--ok:#12a579;--w:#f59e0b;--sh:0 1px 2px rgba(23,32,58,.06),0 8px 24px rgba(40,60,130,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1220;--c:#151c30;--t:#e8ecf8;--m:#8e9bbb;--p:#4d93ff;--p2:#2a6df0;--b:#26304c;--sh:0 8px 28px rgba(0,0,0,.35)}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--t);background:radial-gradient(900px 400px at 10% -10%,rgba(2,101,254,.12),transparent),radial-gradient(800px 400px at 100% 0,rgba(2,101,254,.14),transparent),var(--bg);min-height:100vh}
nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;align-items:center;padding:10px 16px;background:linear-gradient(120deg,var(--p),var(--p2));box-shadow:0 6px 24px rgba(2,101,254,.35);overflow-x:auto;white-space:nowrap}
nav b{color:#fff;font-size:17px;letter-spacing:.2px;margin-right:14px}
nav a,nav button{color:#fff;background:none;border:0;padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit;text-decoration:none;transition:background .2s,transform .2s}
nav a:hover,nav button:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}nav a.on{background:rgba(255,255,255,.28);font-weight:600}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:#fff;z-index:9;opacity:0;transition:width .6s,opacity .3s}#bar.on{width:80%;opacity:1}
main{max-width:1120px;margin:22px auto;padding:0 14px}main.in>*{animation:up .45s cubic-bezier(.2,.7,.2,1) both}main.in>*:nth-child(2){animation-delay:.07s}main.in>*:nth-child(3){animation-delay:.14s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--sh);overflow-x:auto;transition:transform .25s,box-shadow .25s}
h3{margin:0 0 12px;font-size:18px}h4{margin:18px 0 8px}
table{border-collapse:separate;border-spacing:0;width:100%}th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--m);background:rgba(120,140,200,.08)}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
th,td{padding:10px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--b)}tbody tr,tr{transition:background .15s}tr:hover td{background:rgba(120,140,200,.07)}
input,select,textarea{font:inherit;padding:9px 12px;border:1.5px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);max-width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px rgba(2,101,254,.16)}
.b{font:inherit;font-weight:600;padding:9px 18px;background:linear-gradient(120deg,var(--p),var(--p2));color:#fff;border:0;border-radius:10px;cursor:pointer;box-shadow:0 6px 16px rgba(2,101,254,.3);transition:transform .15s,box-shadow .2s}
.b:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(2,101,254,.4)}.b:active{transform:scale(.97)}
a{color:var(--p);font-weight:500}.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.m{color:var(--m)}
#msg{position:fixed;bottom:18px;right:18px;padding:12px 18px;border-radius:12px;color:#fff;display:none;z-index:9;box-shadow:var(--sh);animation:pop .25s}
.gi{width:70px;text-align:center;font-weight:600}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.st{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:18px;box-shadow:var(--sh);position:relative;overflow:hidden;animation:pop .5s both;transition:transform .25s}.st:hover{transform:translateY(-4px)}
.st:before{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:linear-gradient(120deg,var(--p),var(--p2));opacity:.15}
.st small{color:var(--m)}.st div{font-size:34px;font-weight:700;background:linear-gradient(120deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.bd{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(18,165,121,.15);color:var(--ok)}.bd.arxiv{background:rgba(245,158,11,.18);color:var(--w)}
.login{max-width:380px;margin:9vh auto;text-align:center;padding:34px 28px;animation:pop .5s both}.login .row{flex-direction:column}.login input{width:100%}
.logo{width:68px;height:68px;margin:0 auto 12px;border-radius:20px;display:grid;place-items:center;font-size:34px;background:linear-gradient(120deg,var(--p),var(--p2));box-shadow:0 10px 26px rgba(2,101,254,.4);animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}.login h2{margin:0}
@media(max-width:640px){main{margin-top:14px}.card{padding:14px;border-radius:14px}nav b{display:none}}
.hero{max-width:1000px;margin:24px auto 18px;padding:26px 24px;border-radius:20px;color:#fff;background:linear-gradient(120deg,var(--p),var(--p2));box-shadow:var(--sh);display:flex;gap:18px;align-items:center;flex-wrap:wrap}.hero img{height:56px}.hero h1{margin:0;font-size:26px}.hero p{margin:4px 0 0;opacity:.85}
.ent{max-width:1000px;margin:0 auto 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.ent .card{margin:0;display:flex;flex-direction:column;gap:10px}.ent h3{margin:0}.ent .row{flex-direction:column;margin:0}.ent input{width:100%}
.pub{max-width:1000px;margin:0 auto}.lbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.lbs .card{margin:0}.win{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;color:#fff;background:linear-gradient(120deg,var(--p),var(--p2));margin-bottom:8px}.win b{font-size:19px}.win .t{font-size:34px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{nav,.row,#msg,#bar{display:none}.card{border:0;box-shadow:none}body{background:#fff}}
dialog{border:0;border-radius:18px;padding:0;width:min(780px,96vw);max-height:92vh;background:var(--c);color:var(--t);box-shadow:0 30px 80px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(8,20,50,.55);backdrop-filter:blur(3px)}dialog[open]{animation:pop .25s both}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:linear-gradient(120deg,var(--p),var(--p2));color:#fff}.dh h3{margin:0}.dh .x{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
.db{padding:18px 22px;overflow:auto;max-height:calc(92vh - 140px)}.df{padding:14px 22px;border-top:1px solid var(--b);display:flex;gap:10px;justify-content:flex-end}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.fg label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--m)}.fg input,.fg select,.fg textarea{font-size:15px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.chip{cursor:pointer}.chip input{display:none}.chip span{display:inline-block;padding:6px 14px;border-radius:999px;border:1.5px solid var(--b);transition:.15s}.chip input:checked+span{background:var(--p);border-color:var(--p);color:#fff}
.chip2{display:inline-block;margin:4px 4px 0 0;padding:2px 10px;border-radius:999px;background:rgba(2,101,254,.12);color:var(--p);font-size:12px;font-weight:600}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.tc{display:flex;gap:14px;padding:16px;border:1px solid var(--b);border-radius:16px;background:var(--c);cursor:pointer;position:relative;transition:transform .2s,box-shadow .2s}.tc:hover{transform:translateY(-3px);box-shadow:var(--sh)}.tc.off{opacity:.55}
.av{flex:none;width:64px;height:64px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff;background:linear-gradient(120deg,var(--p),var(--p2))}.av img{width:100%;height:100%;object-fit:cover}
.ph{display:flex;gap:16px;align-items:center;margin-bottom:6px}.ph .av{width:88px;height:88px;font-size:34px}.g{background:none;border:0;color:var(--r);cursor:pointer;font:inherit}
.lg{height:36px;margin-right:8px}.cred{padding:18px;border-radius:12px;background:rgba(18,165,121,.1);font-size:17px;line-height:1.8}nav:empty{display:none}
.lh{margin:-34px -28px 22px;padding:30px 20px;background:linear-gradient(120deg,var(--p),var(--p2));border-radius:16px 16px 0 0}.lh img{width:230px;max-width:80%}
.lp{background:linear-gradient(120deg,var(--p),var(--p2));padding:10px 16px;border-radius:10px;display:inline-block}.lp img{height:44px;display:block}
</style></head><body>
<div id=bar></div><nav id=nav></nav><main id=main></main><div id=msg></div><dialog id=dlg></dialog>
<script>
const $=s=>document.querySelector(s),M=$('#main');let U,D={},NAME='Maktab',LOGO='/logo.png',BR='',NL,PL=false;
const e=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const api=async(m,p,b)=>{const r=await fetch('/api'+p,{method:m,headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>null);if(j===null)throw new Error('API javob bermayapti (HTTP '+r.status+'). Netlify Functions joylanmagan yoki xato.');if(!r.ok)throw new Error(j.error||('HTTP '+r.status+': '+(j.errorMessage||JSON.stringify(j)).slice(0,300)));return j};
const msg=(t,er)=>{const m=$('#msg');m.textContent=t;m.style.background=er?'var(--r)':'var(--p)';m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',2800)};
const go=async f=>{const B=$('#bar');try{B.classList.add('on');M.style.opacity=.6;await f();}catch(x){msg(x.message,1)}finally{M.style.opacity=1;B.classList.remove('on')}};
const DAYS=['','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba','Yakshanba'];
const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tashkent'});
const wd=(d=>d||7)(new Date(today+'T12:00:00').getDay());
const opt=(a,k='name',sel)=>a.map(x=>`<option value=${x.id} ${x.id==sel?'selected':''}>${e(x[k])}</option>`).join('');
const csv=(rows,n)=>{const t='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=n+'.csv';a.click()};
const TABS=[['dash','🏠 Bosh sahifa'],['journal','📒 Jurnal'],['tt','🗓 Dars jadvali'],['cls','🏫 Sinflar'],['rep','📊 Hisobotlar'],['users','👥 Xodimlar','admin,director'],['set','⚙️ Sozlamalar','admin']];
async function boot(){try{const p=await api('GET','/public');NAME=p.school_name;LOGO=p.logo||'/logo.png';BR=p.brand||'';PL=!!p.leaders_public;brandIt(BR);document.title=NAME}catch(x){$('#nav').innerHTML='<b>Maktab platformasi</b>';M.innerHTML='<div class="card login"><div class=logo>⚠️</div><h3>Server bilan aloqa yo\'q</h3><p>'+e(x.message)+'</p><p class=m>Tekshiring: <code>/api/public</code> manzilini brauzerda oching. Netlify → Functions bo\'limida «api» funksiyasi va Environment variables (TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, SESSION_SECRET, ADMIN_PASSWORD) bo\'lishi kerak.</p></div>';return}
 try{U=await api('GET','/me');await load();}catch{login()}}
async function load(){[D.classes,D.subjects,D.asg,D.gt,D.slots]=await Promise.all([api('GET','/classes'),api('GET','/subjects'),api('GET','/assignments'),api('GET','/grade_types'),api('GET','/bell_slots')]);
 if(U.role!='teacher'){D.users=await api('GET','/users')}nav('dash')}
const brandHtml=()=>`<img class=lg src="${e(LOGO)}" alt=""><b>${e(NAME)}</b>`;
function brandIt(c){if(!/^#[0-9a-f]{6}$/i.test(c||''))return;const r=document.documentElement.style;r.setProperty('--p',c);r.setProperty('--p2','#'+[1,3,5].map(i=>Math.round(parseInt(c.substr(i,2),16)*.72).toString(16).padStart(2,'0')).join(''))}
function nav(v){$('#nav').innerHTML=brandHtml()+TABS.filter(t=>!t[2]||t[2].includes(U.role)).map(t=>`<a href=# class="${t[0]==v?'on':''}" onclick="nav('${t[0]}');return false">${t[1]}</a>`).join('')+`<span style="flex:1"></span><span style="color:#fff">${e(U.name)}</span><button onclick="out()">Chiqish</button>`;M.classList.remove('in');void M.offsetWidth;M.classList.add('in');go(V[v])}
async function out(){await api('POST','/logout');location.reload()}
const LB=(t,ic,b)=>{const f=b&&b.items&&b.items[0],rest=b?(b.items||[]).slice(1):[];return `<div class=card><h3>${ic} ${t} ${b&&b.label?`<span class=bd>${e(b.label)}</span>`:''}</h3>${f?`<div class=win><span class=t>🏆</span><div><b>${e(f.name)}</b><div>${e(f.class)} · o'rtacha ${f.percent}% · ${f.grades} ta baho</div></div></div>${rest.length?`<ol start=2 style="margin:0;padding-left:22px">${rest.map(x=>`<li>${e(x.name)} <span class=m>· ${e(x.class)}</span> — <b>${x.percent}%</b></li>`).join('')}</ol>`:''}<p class=m style="font-size:12px;margin:8px 0 0">${b.from} — ${b.to}. Kamida ${b.min_grades} ta baholangan ish bo'lgan o'quvchilar hisobga olinadi.</p>`:'<p class=m>Hali yetarli baho yo\'q.</p>'}</div>`};
async function login(){$('#nav').innerHTML='';let h=null;try{h=await api('GET','/public/home')}catch{}
 const st=h&&h.stats;
 M.innerHTML=`<div class=hero><img src="${e(LOGO)}" alt=""><div><h1>${e(NAME)}</h1><p>Maktab boshqaruv platformasi: dars jadvali, elektron jurnal, davomat va hisobotlar</p></div></div>
 <div class=ent><div class=card><h3>👨‍🏫 Xodimlar kirishi</h3><p class=m style="margin:0">Administrator, direktor, o'qituvchi va sinf rahbari.</p><div class=row><input id=l placeholder=Login autocomplete=username><input id=p type=password placeholder=Parol autocomplete=current-password onkeydown="event.key=='Enter'&&doLogin()"></div><button class=b onclick="doLogin()">Kirish</button></div>
 <div class=card><h3>🎓 O'quvchi va ota-ona</h3><p class=m style="margin:0">Baholar, davomat va dars jadvali haqida ma'lumotni sinf rahbari yoki fan o'qituvchisidan oling.</p><p class=m style="margin:0">Shaxsiy kabinet keyingi bosqichda qo'shiladi.</p></div></div>
 ${st?`<div class=pub><div class=stats><div class=st><small>Sinflar</small><div>${st.classes}</div></div><div class=st><small>O'quvchilar</small><div>${st.students}</div></div><div class=st><small>O'qituvchilar</small><div>${st.teachers}</div></div></div>${h.leaders?`<div class=lbs>${LB("Hafta o'quvchisi",'⭐',h.leaders.week)}${LB("Oy o'quvchisi",'🌟',h.leaders.month)}</div><p class=m style="font-size:12px">Maxfiylik uchun faqat familiya va ism bosh harfi ko'rsatiladi.</p>`:''}</div>`:''}`}
const doLogin=()=>go(async()=>{U=await api('POST','/login',{login:$('#l').value,password:$('#p').value});await load()});
const V={
async dash(){const d=await api('GET','/dashboard'),ld=await api('GET','/leaders').catch(()=>null),A=d.attendance_today,t=d.lessons_today,sm=A.keldi+A.kelmadi+A.kechikdi+A.uzrli;
 M.innerHTML=`<div class=stats><div class=st><small>Bugungi darslar</small><div>${t.length}</div></div><div class=st style=animation-delay:.08s><small>Sinflar</small><div>${d.classes}</div></div><div class=st style=animation-delay:.16s><small>O'quvchilar (faol)</small><div>${d.students}</div></div><div class=st style=animation-delay:.24s><small>Bugun kelmadi</small><div>${A.kelmadi}</div></div></div>
 <div class=card><h3>Bugungi darslar — ${DAYS[d.weekday]}, ${d.date}</h3>${t.length?`<table><tr><th>Vaqt<th>Sinf<th>Fan<th>Xona<th>O'qituvchi</tr>${t.map(x=>`<tr><td>${x.start}–${x.end}<td>${e(x.class)}<td>${e(x.subject)}<td>${e(x.room)}<td>${e(x.teacher)}`).join('')}</table>`:"<p class=m>Bugun dars yo'q.</p>"}</div>
 <div class=card><h3>Bugungi davomat</h3>${sm?`<p>Keldi: <b>${A.keldi}</b> · Kelmadi: <b>${A.kelmadi}</b> · Kechikdi: <b>${A.kechikdi}</b> · Uzrli: <b>${A.uzrli}</b></p>`:"<p class=m>Bugun hali davomat belgilanmagan.</p>"}<p class=m>Ko'rsatkichlar: ${e(d.scope)}. Belgilanmagan o'quvchi «keldi» deb hisoblanmaydi.</p></div>
 <div class=card><h3>So'nggi kiritilgan baholar</h3>${d.recent_grades.length?`<table><tr><th>Sana<th>O'quvchi<th>Sinf<th>Fan<th>Tur<th>Baho</tr>${d.recent_grades.map(g=>`<tr><td>${g.date}<td>${e(g.student)}<td>${e(g.class)}<td>${e(g.subject)}<td>${e(g.type)}<td>${g.value}/${g.max}`).join('')}</table>`:"<p class=m>Hali baho kiritilmagan.</p>"}</div>
 ${ld?`<div class=lbs>${LB("Hafta o'quvchisi",'⭐',ld.week)}${LB("Oy o'quvchisi",'🌟',ld.month)}</div><p class=m style="margin:6px 0 16px;font-size:12px">Ko'rsatkichlar: ${e(ld.scope)}. Baholangan ishlarning o'rtacha foizi.</p>`:''}
 <div class=card><h3>Tezkor amallar</h3><div class=row><button class=b onclick="nav('journal')">📒 Jurnalni ochish</button><button class=b onclick="nav('tt')">🗓 Haftalik jadval</button><button class=b onclick="nav('rep')">📊 Hisobotlar</button></div></div>`},
async journal(){const gts=D.gt.filter(g=>g.is_active);M.innerHTML=`<div class=card><div class=row><select id=jc>${opt(D.classes)}</select><select id=js>${opt(D.subjects)}</select><input type=date id=jd value=${today}><select id=jl title="Dars raqami (davomat shu dars uchun saqlanadi)"><option value=0>Dars: —${D.slots.map(x=>`<option value=${x.no}>${x.no}-dars (${x.start})`).join('')}</select><select id=jt onchange="jm.value=(D.gt.find(g=>g.name==this.value)||{}).max||5">${gts.map(g=>`<option>${e(g.name)}`).join('')}</select><label>maks <input id=jm type=number min=1 value=${gts[0]?gts[0].max:5} style="width:64px"></label><button class=b onclick="go(loadJ)">Ochish</button></div><div id=jb class=m>Sinf va fanni tanlab «Ochish» ni bosing.</div></div>`},
async tt(){const list=await api('GET','/timetable'+(U.role=='teacher'?'?teacher_id='+U.id:''));const adm=U.role=='admin',tch=(D.users||[]).filter(x=>x.role=='teacher');
 M.innerHTML=`${adm?`<div class=card><h3>Dars qo'shish</h3><div class=row><select id=tc>${opt(D.classes)}</select><select id=ts>${opt(D.subjects)}</select><select id=tu>${opt(tch)}</select><select id=tw>${DAYS.slice(1).map((d,i)=>`<option value=${i+1}>${d}`).join('')}</select><input id=t1 type=time value=08:00><input id=t2 type=time value=08:45><input id=tr placeholder=Xona style="width:80px"><button class=b onclick="go(addTT)">Qo'shish</button></div></div>`:''}
 <div class=card><div class=row><h3 style="margin:0;flex:1">Haftalik jadval</h3><button class=b onclick=print()>Chop etish / PDF</button></div><table><tr><th>Kun<th>Vaqt<th>Sinf<th>Fan<th>Xona<th>O'qituvchi${adm?'<th>':''}</tr>${list.map(x=>`<tr><td>${DAYS[x.weekday]}<td>${x.start}–${x.end}<td>${e(x.class)}<td>${e(x.subject)}<td>${e(x.room)}<td>${e(x.teacher)}${adm?`<td><a href=# onclick="go(()=>delTT(${x.id}));return false">o'chirish</a>`:''}`).join('')}</table></div>`},
async cls(){const adm=U.role=='admin';M.innerHTML=`${adm?`<div class=card><h3>Sozlash</h3><div class=row><input id=cn placeholder="Sinf (7-A)" style="width:100px"><input id=cy placeholder="2026-2027" style="width:110px"><select id=ch><option value="">Sinf rahbari</option>${opt(D.users.filter(x=>x.role=='teacher'))}</select><button class=b onclick="go(addCls)">Sinf qo'shish</button></div>
 <div class=row><input id=sn placeholder="Yangi fan"><button class=b onclick="go(addSub)">Fan qo'shish</button></div>

 <h4>Fanlar bo'yicha o'rtacha (baholangan ishlar, %)</h4>${Object.keys(by).length?`<table><tr><th>Fan<th>O'rtacha<th>Ishlar soni</tr>${Object.entries(by).map(([k,v])=>`<tr><td>${e(k)}<td>${(v.reduce((a,b)=>a+b,0)/v.length).toFixed(0)}%<td>${v.length}`).join('')}</table>`:"<p class=m>Baho yo'q</p>"}
 <h4>Baholar tarixi</h4>${r.grades.length?`<table><tr><th>Sana<th>Fan<th>Tur<th>Baho<th>Izoh</tr>${r.grades.map(g=>`<tr><td>${g.date}<td>${e(g.subject)}<td>${e(g.type)}<td>${g.value}/${g.max}<td>${e(g.comment)}`).join('')}</table>`:"<p class=m>—</p>"}
 <h4>Davomat tarixi</h4>${r.attendance.length?`<table><tr><th>Sana<th>Fan<th>Holat<th>Izoh</tr>${r.attendance.map(g=>`<tr><td>${g.date}<td>${e(g.subject)}<td>${e(g.status)}<td>${e(g.note)}`).join('')}</table>`:"<p class=m>—</p>"}</div><div class=df><button type=button class=b onclick="dlg.close()">Yopish</button></div>`;dlg.showModal()}
function editS(id){const s=ST.find(x=>x.id==id);dlg.innerHTML=`<div class=dh><h3>O'quvchini tahrirlash</h3><button type=button class=x onclick="dlg.close()">✕</button></div><div class=db><div class=fg>${F('zn',"F.I.Sh. *",s.name)}${F('zc','Kod',s.code||'')}${F('zp','Ota-ona aloqasi',s.parent_contact||'')}<label>Sinf<select id=zk>${opt(D.classes,'name',s.class_id)}</select></label><label>Holat<select id=zst><option value=faol ${s.status=='faol'?'selected':''}>faol<option value=arxiv ${s.status=='arxiv'?'selected':''}>arxiv</select></label></div><p class=m>Sinfni o'zgartirish avvalgi baho va davomatni buzmaydi: ular eski sinf bilan saqlanadi.</p></div><div class=df><button type=button class=g style="color:var(--m)" onclick="dlg.close()">Bekor qilish</button><button type=button class=b onclick="go(()=>saveS(${s.id}))">Saqlash</button></div>`;dlg.showModal()}
const saveS=async id=>{await api('PATCH','/students/'+id,{name:zn.value,code:zc.value,parent_contact:zp.value,class_id:+zk.value,status:zst.value});dlg.close();msg('Saqlandi');loadSt()};

V.set=async function(){const [Y,gt,sl,au]=await Promise.all([api('GET','/academic_years'),api('GET','/grade_types'),api('GET','/bell_slots'),api('GET','/audit')]);D.gt=gt;D.slots=sl;
 const tm=t=>new Date(String(t).replace(' ','T')+'Z').toLocaleString('sv-SE',{timeZone:'Asia/Tashkent'});
 M.innerHTML=`<div class=card><h3>O'quv yili va choraklar</h3><table><tr><th>Yil<th>Davr<th>Holat<th></tr>${Y.years.map(y=>`<tr><td>${e(y.name)}<td>${y.start_date} – ${y.end_date}<td>${y.is_current?'<span class=bd>joriy</span>':''}<td>${y.is_current?'':`<a href=# onclick="go(()=>curY(${y.id}));return false">joriy qilish</a>`}`).join('')||"<tr><td colspan=4 class=m>Hali yo'q"}</table>
 <p>${Y.terms.map(t=>`<span class=chip2>${e(t.name)}: ${t.start_date} … ${t.end_date}</span>`).join('')}</p>
 <h4>Yangi o'quv yili</h4><div class=row><input id=zyn placeholder="2026-2027" style="width:110px"><input type=date id=zys><input type=date id=zye><label><input type=checkbox id=zyc> joriy</label><button class=b onclick="go(addY)">Qo'shish</button></div>
 <h4>Yangi chorak / semestr</h4><div class=row><select id=zty>${Y.years.map(y=>`<option value=${y.id}>${e(y.name)}`).join('')}</select><input id=ztn placeholder="1-chorak" style="width:110px"><input type=date id=zts><input type=date id=zte><button class=b onclick="go(addTerm)">Qo'shish</button></div></div>
 <div class=card><h3>Dars vaqtlari</h3><p class=m>Har qatorda bitta dars: <code>08:00-08:45</code>. Tartib raqami avtomatik (1, 2, 3 …).</p><textarea id=zsl rows=8 style="width:100%;max-width:280px">${sl.map(x=>x.start+'-'+x.end).join('\n')}</textarea><div class=row style="margin-top:10px"><button class=b onclick="go(saveSlots)">Saqlash</button></div></div>
 <div class=card><h3>Baholash turlari</h3><table><tr><th>Tur<th>Maks. ball<th>Vazn<th>Faol</tr>${gt.map(g=>`<tr><td>${e(g.name)}<td><input class=gi type=number step=any value=${g.max} onchange="go(()=>patchGT(${g.id},{max:+this.value}))"><td><input class=gi type=number step=any value=${g.weight} onchange="go(()=>patchGT(${g.id},{weight:+this.value}))"><td><input type=checkbox ${g.is_active?'checked':''} onchange="go(()=>patchGT(${g.id},{is_active:this.checked?1:0}))">`).join('')}</table>
 <div class=row style="margin-top:10px"><input id=zgn placeholder="Yangi tur (masalan: test)"><input id=zgm type=number step=any placeholder="maks" value=5 style="width:80px"><button class=b onclick="go(addGT)">Qo'shish</button></div>
 <p class=m><b>O'rtacha baho formulasi:</b> har bir baholangan ish uchun <code>baho ÷ maksimal ball × 100</code> hisoblanadi, so'ng shu fan va davrdagi ishlarning oddiy o'rtachasi olinadi. Baholanmagan ish hisobga olinmaydi va nol deb olinmaydi. <i>Vazn maydoni saqlanadi, lekin hozircha o'rtachani hisoblashda qo'llanmaydi.</i> Standart shkala 1–5; turning maksimal balli orqali ball (masalan 100) ham mumkin.</p></div>
 <div class=card><h3>Zaxira va tiklash</h3><div class=row><button class=b onclick="go(backup)">Zaxira nusxa olish (JSON)</button><label class=b style="background:var(--r);box-shadow:none">Zaxiradan tiklash<input type=file accept=".json,application/json" hidden onchange="go(()=>doRestore(this))"></label></div><p class=m>Tiklash joriy ma'lumotlarni zaxiradagi holat bilan almashtiradi (xodimlar o'chirilmaydi, parollar zaxiraga kirmaydi). Avval yangi zaxira nusxa oling.</p></div>
 <div class=card><h3>Audit jurnali (so'nggi 200 ta)</h3><table><tr><th>Vaqt (Toshkent)<th>Kim<th>Amal<th>Obyekt<th>ID</tr>${au.map(a=>`<tr><td>${tm(a.at)}<td>${e(a.user)}<td>${e(a.action)}<td>${e(a.entity)}<td>${e(a.entity_id)}`).join('')}</table></div>`};
const curY=async id=>{await api('PATCH','/academic_years/'+id,{is_current:1});msg('Saqlandi');V.set()};
const addY=async()=>{await api('POST','/academic_years',{name:zyn.value,start_date:zys.value,end_date:zye.value,is_current:zyc.checked?1:0});msg('Saqlandi');V.set()};
const addTerm=async()=>{await api('POST','/terms',{year_id:+zty.value,name:ztn.value,start_date:zts.value,end_date:zte.value});msg('Saqlandi');V.set()};
const saveSlots=async()=>{const slots=zsl.value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(\d{1,2}:\d{2})\s*[-–—]\s*(\d{1,2}:\d{2})$/);if(!m)throw new Error("Noto'g'ri qator: "+l);const p=t=>t.padStart(5,'0');return{start:p(m[1]),end:p(m[2])}});await api('PUT','/bell_slots',{slots});msg('Saqlandi');V.set()};
const patchGT=async(id,b)=>{await api('PATCH','/grade_types/'+id,b);msg('Saqlandi');D.gt=await api('GET','/grade_types')};
const addGT=async()=>{await api('POST','/grade_types',{name:zgn.value,max:+zgm.value});msg('Saqlandi');V.set()};
const doRestore=async el=>{const f=el.files[0];el.value='';if(!f)return;let data;try{data=JSON.parse(await f.text())}catch{throw new Error("Fayl JSON emas")}
 if(prompt("Joriy ma'lumotlar zaxiradagi holat bilan ALMASHTIRILADI. Davom etish uchun TIKLASH deb yozing:")!=='TIKLASH'){msg('Bekor qilindi');return}
 const r=await api('POST','/restore',{data,confirm:'TIKLASH'});msg("Tiklandi: "+r.restored.students+" o'quvchi, "+r.restored.grades+" baho");await load()};

boot();
</script></body></html>
