<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maktab platformasi</title>
<meta name="theme-color" content="#0265fe"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Maktab">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fc;--c:#fff;--c2:#f7f9fd;--t:#0f1a35;--m:#66738f;--p:#0265fe;--p2:#0a3fc4;--b:#e4e9f4;--r:#e5484d;--ok:#12a579;--w:#f59e0b;--vi:#7c5cff;
--sh:0 1px 2px rgba(15,26,53,.05),0 10px 30px rgba(30,50,120,.07);--sh2:0 2px 4px rgba(15,26,53,.06),0 18px 44px rgba(30,50,120,.14);--rd:18px;--sw:262px}
:root[data-theme=dark]{--bg:#0a1020;--c:#121a30;--c2:#0f162a;--t:#e8ecf8;--m:#8f9cbd;--p:#4d93ff;--p2:#2a6df0;--b:#232d49;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.28);--sh2:0 18px 44px rgba(0,0,0,.5)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1020;--c:#121a30;--c2:#0f162a;--t:#e8ecf8;--m:#8f9cbd;--p:#4d93ff;--p2:#2a6df0;--b:#232d49;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.28);--sh2:0 18px 44px rgba(0,0,0,.5)}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--t);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
a{color:var(--p);font-weight:500;text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0}h3{font-size:17px;font-weight:700}h4{margin:20px 0 10px;font-size:14px;font-weight:700;color:var(--m);text-transform:uppercase;letter-spacing:.6px}
.m{color:var(--m)}.sm{font-size:13px}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--p),var(--vi));z-index:99;opacity:0;transition:width .6s,opacity .3s}#bar.on{width:80%;opacity:1}

/* ---------- qobiq ---------- */
#side{position:fixed;inset:0 auto 0 0;width:var(--sw);z-index:40;display:flex;flex-direction:column;padding:18px 14px;color:#cbd6f2;background:radial-gradient(420px 260px at 0 0,rgba(2,101,254,.35),transparent),linear-gradient(180deg,#0e1c44,#091129);transition:transform .28s cubic-bezier(.3,.7,.2,1)}
#side:empty{display:none}
.brand{display:flex;gap:11px;align-items:center;padding:6px 8px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.brand img{width:44px;height:44px;object-fit:contain;border-radius:12px;background:rgba(255,255,255,.08);padding:4px}
.brand b{color:#fff;font-size:15px;line-height:1.25;font-weight:700}.brand small{display:block;color:#8ea2d6;font-size:11.5px;font-weight:500;margin-top:2px}
.grp{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:#6f83bb;padding:14px 12px 6px;font-weight:600}
#side a.nv{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;color:#c6d2f0;font-weight:500;text-decoration:none;transition:background .18s,color .18s,transform .18s;position:relative}
#side a.nv:hover{background:rgba(255,255,255,.07);color:#fff}
#side a.nv.on{background:linear-gradient(120deg,var(--p),var(--p2));color:#fff;box-shadow:0 8px 20px rgba(2,101,254,.4)}
.sf{margin-top:auto;padding:12px;border-radius:14px;background:rgba(255,255,255,.06);display:flex;gap:10px;align-items:center}
.sf .av{width:40px;height:40px;font-size:14px}.sf b{color:#fff;font-size:13.5px;display:block;line-height:1.25}.sf small{color:#8ea2d6;font-size:11.5px}
.sf button{margin-left:auto;background:rgba(255,255,255,.08);border:0;color:#cbd6f2;width:36px;height:36px;border-radius:10px;cursor:pointer;display:grid;place-items:center;transition:.2s}.sf button:hover{background:var(--r);color:#fff}
#ov{display:none}
.wrap{margin-left:var(--sw);min-height:100vh}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--b)}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.3px}.top small{display:block;color:var(--m);font-size:13px;font-weight:500;margin-top:1px}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--b);background:var(--c);color:var(--t);display:grid;place-items:center;cursor:pointer;transition:.18s;box-shadow:var(--sh)}.ib:hover{border-color:var(--p);color:var(--p)}
#burger{display:none}
main{padding:24px 28px 60px;max-width:1320px}main.in>*{animation:up .45s cubic-bezier(.2,.7,.2,1) both}main.in>*:nth-child(2){animation-delay:.06s}main.in>*:nth-child(3){animation-delay:.12s}main.in>*:nth-child(4){animation-delay:.18s}
body.pub #side,body.pub .top{display:none}body.pub .wrap{margin:0}body.pub main{max-width:none;margin:0;padding:0}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

/* ---------- komponentlar ---------- */
.card{background:var(--c);border:1px solid var(--b);border-radius:var(--rd);padding:22px;margin-bottom:20px;box-shadow:var(--sh);overflow-x:auto}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}.ch h3{flex:1;display:flex;gap:10px;align-items:center}.ch h3 .i{color:var(--p)}
.ch .sub{display:block;font-size:13px;font-weight:500;color:var(--m);margin-top:1px}
table{border-collapse:separate;border-spacing:0;width:100%}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--m);background:var(--c2);font-weight:700;position:sticky;top:0}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
th,td{padding:12px 14px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--b)}tbody tr:last-child td,table tr:last-child td{border-bottom:0}
tr{transition:background .15s}tr:hover td{background:color-mix(in srgb,var(--p) 4%,transparent)}
input,select,textarea{font:inherit;padding:10px 13px;border:1.5px solid var(--b);border-radius:12px;background:var(--c);color:var(--t);max-width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px color-mix(in srgb,var(--p) 18%,transparent)}
input::placeholder{color:#9aa6c2}
.b{font:inherit;font-weight:600;padding:10px 18px;background:linear-gradient(120deg,var(--p),var(--p2));color:#fff;border:0;border-radius:12px;cursor:pointer;box-shadow:0 8px 18px color-mix(in srgb,var(--p) 32%,transparent);transition:transform .15s,box-shadow .2s;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none}
.b:hover{transform:translateY(-2px);box-shadow:0 12px 24px color-mix(in srgb,var(--p) 42%,transparent);text-decoration:none}.b:active{transform:scale(.97)}
.b.gh{background:var(--c);color:var(--t);border:1.5px solid var(--b);box-shadow:none}.b.gh:hover{border-color:var(--p);color:var(--p);box-shadow:none}
.b.dn{background:linear-gradient(120deg,#ef5a5f,#cf3338);box-shadow:0 8px 18px rgba(229,72,77,.3)}.b.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.row:last-child{margin-bottom:0}
.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px;background:var(--c2);border:1px solid var(--b);border-radius:14px;margin-bottom:18px}
.tb label{display:flex;gap:8px;align-items:center;color:var(--m);font-size:13px;font-weight:600}
.empty{padding:34px 10px;text-align:center;color:var(--m)}.empty .i{width:38px;height:38px;color:#b8c3de;margin-bottom:8px;display:block;margin-inline:auto}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--m) 14%,transparent);color:var(--m)}
.pill.g5{background:rgba(18,165,121,.14);color:var(--ok)}.pill.g4{background:rgba(2,101,254,.12);color:var(--p)}.pill.g3{background:rgba(245,158,11,.16);color:#c77a00}.pill.g2{background:rgba(229,72,77,.13);color:var(--r)}
.bd{padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(18,165,121,.14);color:var(--ok)}.bd.arxiv{background:rgba(245,158,11,.16);color:#c77a00}
.chip2{display:inline-block;margin:4px 4px 0 0;padding:3px 11px;border-radius:999px;background:color-mix(in srgb,var(--p) 11%,transparent);color:var(--p);font-size:12px;font-weight:600}
.av{flex:none;width:38px;height:38px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--p),var(--vi))}.av img{width:100%;height:100%;object-fit:cover}
.av.c1{background:linear-gradient(135deg,#12a579,#0b7d5a)}.av.c2{background:linear-gradient(135deg,#f59e0b,#d97706)}.av.c3{background:linear-gradient(135deg,#7c5cff,#5b3dd6)}.av.c4{background:linear-gradient(135deg,#ec4899,#be185d)}.av.c5{background:linear-gradient(135deg,#06b6d4,#0e7490)}
.who{display:flex;gap:12px;align-items:center}
.gi{width:74px;text-align:center;font-weight:700;font-size:16px;padding:8px}
.x{background:none;border:0;cursor:pointer;color:inherit}.g{background:none;border:0;color:var(--r);cursor:pointer;font:inherit}
.lg{height:36px}

/* statistika kartalari */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin-bottom:20px}
.st{position:relative;overflow:hidden;background:var(--c);border:1px solid var(--b);border-radius:var(--rd);padding:20px;box-shadow:var(--sh);display:flex;gap:16px;align-items:center;animation:pop .5s both;transition:transform .25s,box-shadow .25s}
.st:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
.st .ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;color:#fff;flex:none;background:linear-gradient(135deg,var(--p),var(--p2))}.st .ico .i{width:26px;height:26px}
.st.t2 .ico{background:linear-gradient(135deg,#12a579,#0b7d5a)}.st.t3 .ico{background:linear-gradient(135deg,#7c5cff,#5b3dd6)}.st.t4 .ico{background:linear-gradient(135deg,#f59e0b,#d97706)}.st.t5 .ico{background:linear-gradient(135deg,#ef5a5f,#cf3338)}
.st small{color:var(--m);font-weight:600;font-size:13px;display:block}.st .n{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin-top:2px}

/* bosh sahifa */
.greet{position:relative;overflow:hidden;border-radius:24px;padding:28px 30px;color:#fff;margin-bottom:20px;background:radial-gradient(500px 280px at 90% -20%,rgba(255,255,255,.28),transparent),linear-gradient(120deg,var(--p),var(--p2));box-shadow:0 18px 40px color-mix(in srgb,var(--p) 35%,transparent);display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.greet:after{content:"";position:absolute;right:-60px;bottom:-90px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.1)}
.greet h2{font-size:26px;font-weight:800;letter-spacing:-.5px}.greet p{margin:6px 0 0;opacity:.88}.greet .grow{flex:1;min-width:220px;position:relative;z-index:1}
.greet .b{background:#fff;color:var(--p2);box-shadow:0 8px 20px rgba(0,0,0,.18);position:relative;z-index:1}
.g2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}.g2 .card{margin-bottom:20px}
.lsn{display:flex;gap:16px;align-items:center;padding:14px;border-radius:14px;border:1px solid var(--b);margin-bottom:10px;background:var(--c);transition:.2s}.lsn:hover{border-color:var(--p);transform:translateX(3px)}
.lsn.now{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--c))}
.lsn .tm{min-width:92px;text-align:center;padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--p) 10%,transparent);color:var(--p);font-weight:700;font-size:14px;line-height:1.25}.lsn .tm small{display:block;font-weight:500;opacity:.8;font-size:12px}
.lsn.now .tm{background:var(--ok);color:#fff}
.lsn b{display:block;font-size:15.5px}.lsn .m{font-size:13px}
.donut{width:150px;height:150px;flex:none}.donut .dn{font-size:28px;font-weight:800;fill:var(--t);font-family:inherit}.donut .dl{font-size:8.5px;fill:var(--m);font-weight:600;font-family:inherit;text-transform:uppercase;letter-spacing:.6px}
.lgd{display:grid;gap:9px;flex:1;min-width:150px}.lgd div{display:flex;gap:9px;align-items:center;font-size:14px}.lgd i{width:11px;height:11px;border-radius:4px;flex:none}.lgd b{margin-left:auto}
.bars{display:grid;gap:12px}.bars div.br{display:grid;grid-template-columns:130px 1fr 26px;gap:12px;align-items:center;font-size:13.5px}
.bars .tr{height:10px;border-radius:99px;background:var(--c2);overflow:hidden;border:1px solid var(--b)}.bars .tr i{display:block;height:100%;border-radius:99px;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.qa a{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:16px;border:1px solid var(--b);background:var(--c2);color:var(--t);font-weight:600;text-decoration:none;transition:.2s}
.qa a:hover{transform:translateY(-3px);border-color:var(--p);box-shadow:var(--sh);text-decoration:none}.qa a span{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--p) 12%,transparent);color:var(--p)}

/* yetakchilar */
.lbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}.lbs .card{margin:0}
.win{position:relative;overflow:hidden;display:flex;gap:16px;align-items:center;padding:18px;border-radius:18px;color:#fff;background:linear-gradient(120deg,#f59e0b,#ef7a1a);margin-bottom:12px;box-shadow:0 12px 26px rgba(245,158,11,.3)}
.win:after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18)}
.win .t{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.25);flex:none}.win .t .i{width:30px;height:30px}.win b{font-size:19px;display:block}.win span.sm{opacity:.92}
.rk{display:flex;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px dashed var(--b)}.rk:last-of-type{border:0}.rk i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--c2);border:1px solid var(--b);font-style:normal;font-weight:700;font-size:13px;color:var(--m)}.rk b:last-child{margin-left:auto;color:var(--p)}

/* jurnal */
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--c2);border:1px solid var(--b)}
.seg button{border:0;background:none;font:inherit;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:9px;color:var(--m);cursor:pointer;transition:.15s}
.seg button:hover:not(:disabled){background:var(--c);color:var(--t)}.seg button:disabled{cursor:default;opacity:.7}
.seg .ok.on{background:var(--ok);color:#fff}.seg .no.on{background:var(--r);color:#fff}.seg .late.on{background:var(--w);color:#fff}.seg .ex.on{background:var(--vi);color:#fff}
.sum{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}.sum div{flex:1;min-width:130px;padding:12px 16px;border-radius:14px;background:var(--c2);border:1px solid var(--b)}.sum small{color:var(--m);font-weight:600;font-size:12px;display:block}.sum b{font-size:22px;font-weight:800}
.gi.g5{border-color:var(--ok);background:rgba(18,165,121,.07)}.gi.g4{border-color:var(--p);background:color-mix(in srgb,var(--p) 6%,transparent)}.gi.g3{border-color:var(--w);background:rgba(245,158,11,.08)}.gi.g2{border-color:var(--r);background:rgba(229,72,77,.07)}
.hist{display:grid;gap:10px}.hist div{display:flex;gap:14px;padding:12px 14px;border-radius:12px;background:var(--c2);border:1px solid var(--b)}.hist time{font-weight:700;color:var(--p);min-width:92px}

/* dars jadvali */
.wk{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;padding-bottom:6px}
.dy{min-width:0}.dy h4{margin:0 0 10px;padding:10px 12px;border-radius:12px;background:var(--c2);border:1px solid var(--b);color:var(--t);text-transform:none;letter-spacing:0;font-size:14px;display:flex;justify-content:space-between}
.dy.today h4{background:linear-gradient(120deg,var(--p),var(--p2));color:#fff;border-color:transparent}
.ls{position:relative;padding:12px 12px 12px 16px;border-radius:14px;background:var(--c);border:1px solid var(--b);margin-bottom:10px;box-shadow:var(--sh);transition:.2s;overflow:hidden}
.ls:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cl,var(--p))}
.ls:hover{transform:translateY(-2px);box-shadow:var(--sh2)}.ls .tm{font-weight:700;font-size:13px;color:var(--cl,var(--p))}.ls b{display:block;font-size:14.5px;margin:2px 0}.ls .m{font-size:12.5px;line-height:1.35}
.ls .del{position:absolute;right:6px;top:6px;opacity:0;width:26px;height:26px;border-radius:8px;border:0;background:rgba(229,72,77,.12);color:var(--r);cursor:pointer;display:grid;place-items:center;transition:.2s}.ls:hover .del{opacity:1}.ls .del .i{width:15px;height:15px}
.free{color:var(--m);font-size:13px;padding:14px;text-align:center;border:1.5px dashed var(--b);border-radius:14px}

/* sinflar */
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:20px}
.cc{cursor:pointer;padding:16px;border-radius:16px;border:1.5px solid var(--b);background:var(--c);text-align:left;font:inherit;color:var(--t);transition:.2s;box-shadow:var(--sh)}
.cc:hover{transform:translateY(-3px);box-shadow:var(--sh2)}.cc.on{border-color:var(--p);background:color-mix(in srgb,var(--p) 6%,var(--c))}
.cc .nm{font-size:24px;font-weight:800;display:flex;justify-content:space-between;align-items:center}.cc .nm span{font-size:12px;font-weight:600;color:var(--m)}.cc .m{font-size:13px;margin-top:4px;display:flex;gap:6px;align-items:center}

/* xodimlar */
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.tc{display:flex;gap:16px;padding:18px;border:1px solid var(--b);border-radius:18px;background:var(--c);cursor:pointer;position:relative;transition:.22s;box-shadow:var(--sh)}.tc:hover{transform:translateY(-4px);box-shadow:var(--sh2);border-color:var(--p)}.tc.off{opacity:.55}
.tc .av{width:66px;height:66px;font-size:22px}
.ph{display:flex;gap:16px;align-items:center;margin-bottom:6px}.ph .av{width:88px;height:88px;font-size:34px}
.nws{padding:16px 18px;border:1px solid var(--b);border-radius:14px;margin-top:12px;background:var(--c,#fff)}
.cred{padding:18px;border-radius:14px;background:rgba(18,165,121,.1);font-size:17px;line-height:1.9}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.chip{cursor:pointer}.chip input{display:none}.chip span{display:inline-block;padding:7px 15px;border-radius:999px;border:1.5px solid var(--b);transition:.15s;font-weight:500}.chip input:checked+span{background:var(--p);border-color:var(--p);color:#fff}
.lp{background:linear-gradient(120deg,var(--p),var(--p2));padding:10px 16px;border-radius:12px;display:inline-block}.lp img{height:44px;display:block}

/* modal */
dialog{border:0;border-radius:22px;padding:0;width:min(800px,96vw);max-height:92vh;background:var(--c);color:var(--t);box-shadow:0 40px 90px rgba(0,0,0,.4)}dialog::backdrop{background:rgba(7,14,36,.6);backdrop-filter:blur(4px)}dialog[open]{animation:pop .25s both}
.dh{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:linear-gradient(120deg,var(--p),var(--p2));color:#fff}.dh h3{margin:0}.dh .x{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;font-size:16px}

// .xlsx ni brauzerning o'zida o'qish (zip + XML), kutubxonasiz
async function xlsxRows(file){const buf=new Uint8Array(await file.arrayBuffer()),dv=new DataView(buf.buffer);let eo=-1;for(let i=buf.length-22;i>=Math.max(0,buf.length-70000);i--)if(dv.getUint32(i,true)==0x06054b50){eo=i;break}
 if(eo<0)throw new Error("Bu .xlsx fayl emas");const n=dv.getUint16(eo+10,true);let p=dv.getUint32(eo+16,true);const F={},dec=new TextDecoder();
 for(let i=0;i<n;i++){if(dv.getUint32(p,true)!=0x02014b50)break;const meth=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true),name=dec.decode(buf.subarray(p+46,p+46+nl));F[name]={meth,cs,lo};p+=46+nl+el+cl}
 const read=async nm=>{const f=F[nm];if(!f)return null;const o=f.lo,nl=dv.getUint16(o+26,true),el=dv.getUint16(o+28,true),d=buf.subarray(o+30+nl+el,o+30+nl+el+f.cs);if(f.meth==0)return dec.decode(d);if(f.meth!=8)throw new Error("Zip usuli qo'llab-quvvatlanmaydi");
  const r=new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return dec.decode(await new Response(r).arrayBuffer())};
 const X=t=>new DOMParser().parseFromString(t,'text/xml'),ss=[],sx=await read('xl/sharedStrings.xml');if(sx)X(sx).querySelectorAll('si').forEach(si=>ss.push([...si.querySelectorAll('t')].map(t=>t.textContent).join('')));
 const sn=Object.keys(F).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]))[0];if(!sn)throw new Error("Varaq topilmadi");
 const col=r=>{let c=0;for(const ch of r.replace(/\d/g,''))c=c*26+ch.charCodeAt(0)-64;return c-1},rows=[];
 X(await read(sn)).querySelectorAll('sheetData > row').forEach(rw=>{const r=[];rw.querySelectorAll(':scope > c').forEach(c=>{const t=c.getAttribute('t'),v=c.querySelector('v'),is=c.querySelector('is');let val='';if(t=='s'&&v)val=ss[+v.textContent]||'';else if(t=='inlineStr'&&is)val=[...is.querySelectorAll('t')].map(x=>x.textContent).join('');else if(v)val=v.textContent;r[col(c.getAttribute('r')||'A1')]=String(val).trim()});for(let i=0;i<r.length;i++)if(r[i]===undefined)r[i]='';if(r.some(x=>x))rows.push(r)});
